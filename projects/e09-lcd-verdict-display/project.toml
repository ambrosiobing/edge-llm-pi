# projects/e09-lcd-verdict-display/project.toml: the manifest CI and the tools read.
[project]
id       = "e09"
title    = "LCD prompt and verdict display"
language = "C++"
variant  = "A"
board    = "Raspberry Pi 3 Model B Rev 1.2, 1 GB, card eplepi"
hat      = "Waveshare 3.5 inch RPi LCD (A) on eleven jumper wires; ADXL345 and three LEDs on pins 1 to 26"
model    = "SmolLM2-360M-Instruct-Q4_K_M.gguf"
grammar  = "grammars/e09_event.gbnf"
prompt   = "projects/e09-lcd-verdict-display/prompt.txt"
rule     = "projects/e09-lcd-verdict-display/src/rules_e09.c"
binary   = "edgellm-e09"
depends  = "libdrm (MIT), the ili9486 and ads7846 drivers of the Linux volume's project 7 overlay"

[build]
# From the repository root, after cmake -S . -B build [-DEDGELLM_STUB_MODEL=ON]; libdrm-dev
# on the host for the panel, otherwise only --headless runs.
command = "cmake --build build --target edgellm-e09 rules_test oracle_check"
# The six rule cases run inside the shared harness; the oracle test exists in a stub build.
test    = "ctest --test-dir build -R 'rules_test|edgellm-e09-oracle' --output-on-failure"

[run]
replay = "build/projects/e09-lcd-verdict-display/edgellm-e09 --project e09 --replay projects/e09-lcd-verdict-display/replay/adxl345_200.csv --grammar projects/e09-lcd-verdict-display/grammar.gbnf --prompt projects/e09-lcd-verdict-display/prompt.txt --model models/SmolLM2-360M-Instruct-Q4_K_M.gguf --state /tmp/e09.state --log projects/e09-lcd-verdict-display/evidence/e09_replay.csv --panel-log projects/e09-lcd-verdict-display/evidence/e09_replay_panel.csv"
stub   = "build/projects/e09-lcd-verdict-display/edgellm-e09 --project e09 --replay projects/e09-lcd-verdict-display/replay/adxl345_200.csv --grammar projects/e09-lcd-verdict-display/grammar.gbnf --prompt projects/e09-lcd-verdict-display/prompt.txt --log /tmp/e09_stub.csv --stub --headless"
live   = "build/projects/e09-lcd-verdict-display/edgellm-e09 --project e09 --live iio /sys/bus/iio/devices/iio:device0:0.1 --g-per-unit 0.1019716 --leds /dev/gpiochip0:4,27,22 --grammar projects/e09-lcd-verdict-display/grammar.gbnf --prompt projects/e09-lcd-verdict-display/prompt.txt --model ~/models/SmolLM2-360M-Instruct-Q4_K_M.gguf --state /tmp/e09.state --log projects/e09-lcd-verdict-display/evidence/e09_run.csv --panel-log projects/e09-lcd-verdict-display/evidence/e09_run_panel.csv --max-events 4000"

[oracle]
expected = "tests/oracle/e09.expected.csv"
compare  = "build/tests/oracle_check /tmp/e09_stub.csv tests/oracle/e09.expected.csv"
table    = "python tools/agreement.py projects/e09-lcd-verdict-display/evidence/e09_run.csv --md"

[acceptance]
# The panel log of the live run: 200 rows of kind decision, every flip_ms under 200;
# 50 rows of kind touch, one per press. Read with the one-liners in wiring.md.
panel_log = "projects/e09-lcd-verdict-display/evidence/e09_run_panel.csv"
frame_ms  = 200
touches   = 50
