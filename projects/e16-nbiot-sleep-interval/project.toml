# projects/e16-nbiot-sleep-interval/project.toml: the manifest CI and the tools read.
[project]
id       = "e16"
title    = "NB-IoT sleep interval from measured microamps"
language = "C"
variant  = "C"
board    = "Raspberry Pi 3 Model B Rev 1.2, card eplepi"
hat      = "Waveshare SIM7020E NB-IoT HAT, one HAT on this header; the PPK2 meters the module rail"
model    = "SmolLM2-360M-Instruct-Q4_K_M.gguf"
grammar  = "grammars/e16_interval.gbnf"
prompt   = "projects/e16-nbiot-sleep-interval/prompt.txt"
rule     = "projects/e16-nbiot-sleep-interval/src/rules_e16.c"
binary   = "edgellm-e16"
io       = "serial, for the AT bring-up only; the scenarios are always replayed"

[build]
# From the repository root, after cmake -S . -B build [-DEDGELLM_STUB_MODEL=ON]. The
# bench build adds -DEDGELLM_IO_SERIAL=ON or --at is refused with that option named.
command = "cmake --build build --target edgellm-e16 e16_battery_test rules_test oracle_check"
# The six rule cases run inside the shared harness; the oracle test exists in a stub build.
test    = "ctest --test-dir build -R 'rules_test|e16_battery_test|edgellm-e16-oracle' --output-on-failure"

[run]
# The scenarios are always the replayed profile summaries (modelled); the measurement is
# the capture that produced them, and the decision is taken offline on the result.
replay = "build/projects/e16-nbiot-sleep-interval/edgellm-e16 --project e16 --replay projects/e16-nbiot-sleep-interval/replay/profiles_100.csv --grammar projects/e16-nbiot-sleep-interval/grammar.gbnf --prompt projects/e16-nbiot-sleep-interval/prompt.txt --model ~/models/SmolLM2-360M-Instruct-Q4_K_M.gguf --n-predict 64 --temperature 0.3 --state /tmp/e16.state --log projects/e16-nbiot-sleep-interval/evidence/e16_run.csv"
stub   = "build/projects/e16-nbiot-sleep-interval/edgellm-e16 --project e16 --replay projects/e16-nbiot-sleep-interval/replay/profiles_100.csv --grammar projects/e16-nbiot-sleep-interval/grammar.gbnf --prompt projects/e16-nbiot-sleep-interval/prompt.txt --n-predict 64 --temperature 0.3 --log /tmp/e16_stub.csv --stub"
plan   = "build/projects/e16-nbiot-sleep-interval/edgellm-e16 --at-plan"
live   = "build/projects/e16-nbiot-sleep-interval/edgellm-e16 --at /dev/ttyAMA0:115200"

[measure]
# The capture is the instrument; the summariser turns it into one scenario row. The PPK2
# is in ampere-meter mode on the module's own supply rail and never on the Raspberry Pi.
capture   = "python tools/ppk2_capture.py --seconds 1200 --rate 100 --out projects/e16-nbiot-sleep-interval/evidence/psm_cycle.csv"
summarise = "python projects/e16-nbiot-sleep-interval/tools/profile_summarise.py projects/e16-nbiot-sleep-interval/evidence/psm_cycle.csv --capacity 2000 --target 365 --granted 3600"
selfcheck = "python projects/e16-nbiot-sleep-interval/tools/profile_summarise.py --self-check"

[oracle]
expected = "tests/oracle/e16.expected.csv"
compare  = "build/tests/oracle_check projects/e16-nbiot-sleep-interval/evidence/e16_run.csv tests/oracle/e16.expected.csv"
table    = "python tools/agreement.py projects/e16-nbiot-sleep-interval/evidence/e16_run.csv --md"
