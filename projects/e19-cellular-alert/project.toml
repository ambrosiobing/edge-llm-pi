# projects/e19-cellular-alert/project.toml: the manifest CI and the tools read.
[project]
id       = "e19"
title    = "Event-driven cellular alert composer"
language = "C"
variant  = "C"
board    = "Raspberry Pi 3 Model B Plus, card eplepi"
hat      = "Waveshare SIM7070G Cat-M, NB-IoT and GPRS HAT. The DFRobot SEN0032 ADXL345 it named on header pins 3 and 5 is RETIRED, decision 138 of Saturday 24 October 2026; from Friday 20 November 2026 the part is the X-NUCLEO-IKS5A1 on four flying leads, reading its LSM6DSO16IS at 0x6B whose WHO_AM_I is 0x22. See wiring.md"
# BLOCKED on two things, and the second was unrecorded until Friday 20 November 2026.
# First the SIM card, which sitting I in BENCH_SITTINGS.md has wanted since it was written.
# Second the accelerometer: this project read the ADXL345, retired on Saturday 24 October
# 2026 by decision 138 after it scanned empty six times against a positive control, and
# NOTHING in this manifest said so for four weeks. It was found by reading the front
# matter's project table, which still named the part, while the substitution to the
# X-NUCLEO-IKS4A1 was being written into e05, e09 and e14. The substitution is four
# projects and not three. The shield answers on all seven addresses, measured Friday
# 20 November 2026, and the reading path is the open part for all four, because no card of
# this bench carries an ST IIO driver.
blocked_on = "a SIM card, and the accelerometer: the ADXL345 is retired and its replacement is the IKS5A1 from Friday 20 November 2026, reading its LSM6DSO16IS at 0x6B; the shield was on a bus and read gravity on Friday 20 November 2026, and st_lsm6dsx builds out of tree and binds, so the reading path works and the SIM card is what is left"
model    = "qwen2.5-0.5b-instruct-q4_k_m.gguf"
grammar  = "grammars/e19_message.gbnf"
prompt   = "projects/e19-cellular-alert/prompt.txt"
rule     = "projects/e19-cellular-alert/src/rules_e19.c"
binary   = "edgellm-e19"

[build]
# From the repository root, after cmake -S . -B build [-DEDGELLM_STUB_MODEL=ON].
command = "cmake --build build --target edgellm-e19 e19_compose_check_test rules_test oracle_check"
# TWO tests in a real-engine build and three in a stub build. The oracle registers only
# under -DEDGELLM_STUB_MODEL=ON, which this project's CMakeLists states in its header and
# cmake/edgellm_project.cmake announces at configure time. ctest does not warn when a -R
# alternation matches fewer tests than it names, so against build/ this line returns
# "100% tests passed, 0 tests failed out of 2" and nothing says the third was asked for.
# Found Sunday 1 November 2026; e17's manifest already carried the condition and this
# one did not.
# The tests: the six classification cases inside the shared harness, this project's
# own nineteen checks on the field checker and the send gate, and the replay oracle.
test    = "ctest --test-dir build -R 'rules_test|e19_compose_check|edgellm-e19-oracle' --output-on-failure"

[run]
replay = "build/projects/e19-cellular-alert/edgellm-e19 --project e19 --replay projects/e19-cellular-alert/replay/alerts_50.csv --grammar projects/e19-cellular-alert/grammar.gbnf --prompt projects/e19-cellular-alert/prompt.txt --model ~/models/qwen2.5-0.5b-instruct-q4_k_m.gguf --state /tmp/e19.state --log projects/e19-cellular-alert/evidence/e19_run.csv --alerts projects/e19-cellular-alert/evidence/e19_alerts.csv"
stub   = "build/projects/e19-cellular-alert/edgellm-e19 --project e19 --replay projects/e19-cellular-alert/replay/alerts_50.csv --grammar projects/e19-cellular-alert/grammar.gbnf --prompt projects/e19-cellular-alert/prompt.txt --log /tmp/e19_stub.csv --alerts /tmp/e19_stub_alerts.csv --stub"
# The live run needs the IIO device of the Linux volume's project 5 overlay and, for a
# send, the modem's AT device and a destination number. Without --modem the loop
# composes and checks and sends nothing, which is the state until a SIM is fitted.
# The live line resolves the IIO device by its NAME and not by its number, which is
# what e07's chapter has said since it was written and what the other sheets had not done.
# Measured Friday 20 November 2026 on board B: st_lsm6dsx creates TWO devices for this part
# and the accelerometer was iio:device1 while iio:device0 was the gyroscope, so the number
# that stood here would have handed this project degrees per second where its rule decides
# on g. The number depends on probe order and is not an identity.
# TWO SETTINGS MUST BE MADE BEFORE A RUN, and wiring.md's pre-flight makes them:
#   the range to +-4 g, because at the default +-2 g a 2 g threshold sits on the 16-bit
#   rail and cannot be exceeded; and the output rate at or above the reader's poll
#   interval, for which there is no exact 50 Hz or 10 Hz and 52 and 12.5 are the nearest
#   above. The record is
#   evidence/2026-11-20_1223_the-first-reading-and-the-rail_pi3bplus.md
live   = "ACC=$(for d in /sys/bus/iio/devices/iio:device*; do grep -qx lsm6dso16is_accel $d/name && echo $d; done); build/projects/e19-cellular-alert/edgellm-e19 --project e19 --live iio $ACC:0.1 --grammar projects/e19-cellular-alert/grammar.gbnf --prompt projects/e19-cellular-alert/prompt.txt --model ~/models/qwen2.5-0.5b-instruct-q4_k_m.gguf --modem /dev/ttyUSB2:115200 --sms-to +4300000000000 --log projects/e19-cellular-alert/evidence/e19_live.csv --alerts projects/e19-cellular-alert/evidence/e19_live_alerts.csv"

[oracle]
expected = "tests/oracle/e19.expected.csv"
compare  = "build/tests/oracle_check projects/e19-cellular-alert/evidence/e19_run.csv tests/oracle/e19.expected.csv"
# The acceptance numbers are the program's own summary line and the alert ledger; the
# rule and model columns of the main log are what the oracle compares.
table    = "python tools/agreement.py projects/e19-cellular-alert/evidence/e19_run.csv --md"

[replay]
generate = "python projects/e19-cellular-alert/tools/make_replay.py"
# Fifty events, one per second: 37 NONE, 5 TAP, 6 TILT, 2 FREEFALL, of which the send
# rule arms 4 and the minimum interval of 10 s blocks 3.
events   = 50
