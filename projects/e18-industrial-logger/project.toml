# projects/e18-industrial-logger/project.toml: the manifest CI and the tools read.
# Two halves, two languages, two build systems, one grammar and one oracle file.
[project]
id       = "e18"
title    = "Mini industrial serial logger"
language = "Rust and C"
variant  = "R3 and R5"
board    = "Raspberry Pi 4 Model B, card B, the spare Verbatim 32 GB"
hat      = "Waveshare WS-28164 isolated RS232, RS485, CAN, CAN FD"
model    = "qwen2.5-0.5b-instruct-q4_k_m.gguf"
grammar  = "grammars/e18_drift.gbnf"
prompt   = "projects/e18-industrial-logger/prompt.txt"
rule     = "projects/e18-industrial-logger/rust/src/rules.rs"
binary   = "edgellm-e18"
daemon   = "edgellm-e18-daemon"
library  = "libedgellm_abi.so, soname libedgellm_abi.so.1, abi version 1000"
abi      = "projects/e18-industrial-logger/c/abi.h"

# This read "blocked on the shared Rust crate, which is not in the tree yet" until
# Saturday 17 October 2026. The crate is in the tree, at common/rust/edgellm, with the
# four modules this project reuses: io, rules, elog and template. What actually stopped
# cargo was this project naming those four modules as cargo features, which the crate
# does not declare, so the manifest was refused before anything compiled. That is fixed
# in rust/Cargo.toml.
#
# What is still true is narrower and worth stating: no job in this repository builds
# either half of e18. The top level CMakeLists.txt globs projects/*/CMakeLists.txt one
# level deep and this project's C half is at c/CMakeLists.txt, and the workflow's Rust
# loop globbed projects/*/Cargo.toml while this project's is at rust/Cargo.toml. The
# workflow's loop is widened in the same change; the C half is still configured by hand
# with c_configure below, which is deliberate, and the chapter says why.
# AND THEN cargo COMPILED IT, for the first time, in skyhorizon's WSL the same evening.
# The line below said "nothing" for about an hour, which was wrong: resolving the manifest
# only got as far as the compiler. The Rust half has never compiled, and it fails on eight
# errors in two kinds. What it expects of the shared crate is written at the top of
# rust/src/main.rs, and the crate was written to a different interface:
#
#   e18 expects                                   common/rust/edgellm has
#   io::replay::Replay::open                      io::Replay::open, no replay module
#   elog::Log::create(path, engine)               elog::Elog::open(path, engine_version)
#   elog::Answer{text,prompt_ms,                  Decision, in lib.rs, with those four
#       generate_ms,n_generated}                      fields and two more
#   template::chatml_system / chatml_user         template::wrap_system(Template::ChatMl, s)
#                                                     and wrap_user, same shape
#   io::serial::Port::open / set_rs485 /          NOTHING. open_live knows "iio" only.
#       write_all / read_exact_timeout
#   rules::RuleCtx::new(n)                        RuleCtx::new(), history fixed at
#                                                     RULE_HISTORY = 16
#
# The first four are renames with identical semantics and are not the reason this is still
# open. The last two are, and neither is a repair:
#
# ONE, there is no serial port in the Rust crate. Four methods, termios, half duplex for
# RS485, and a timed read. This project is the only Rust one that needs serial, so where it
# lives is a decision: common/rust/edgellm/src/io.rs as e18's own header assumes, or inside
# this project. Either way it is new code and it needs a dependency this project does not
# have yet, libc for hand-rolled termios or a serial crate with its licence recorded.
#
# TWO, rules.rs here sets WINDOW = 30 and the crate keeps 16. Dropping the argument the
# compiler objects to would halve this rule's window in silence, and the unit test that
# asserts over WINDOW values would then exercise a history the loop cannot produce. So the
# window is a convention question across both languages, because rules.h fixes
# RULE_HISTORY at 16 in C as well: either the context carries its capacity, or this rule is
# re-specified to 16, or this project keeps its own history and does not use RuleCtx.
#
# The C half is unaffected and green: it configures, builds and passes its ctest.
blocked_on = "the Rust half: no serial port in the shared crate, and WINDOW 30 against RULE_HISTORY 16"

[build]
# The C half is its own CMake project on purpose: the daemon is installed, versioned
# and upgraded without the service being rebuilt, which is the chapter's argument.
# It is NOT picked up by the repository's top level CMakeLists.txt, which globs one
# level deep.
c_configure = "cmake -S projects/e18-industrial-logger/c -B build-e18c -DEDGELLM_STUB_MODEL=ON"
c_command   = "cmake --build build-e18c"
c_test      = "ctest --test-dir build-e18c --output-on-failure"
rust_command = "cargo build --manifest-path projects/e18-industrial-logger/rust/Cargo.toml"
rust_test    = "cargo test --manifest-path projects/e18-industrial-logger/rust/Cargo.toml"
# The FFI backend needs the C library built and a link path; the socket backend and the
# Rust stub need neither, which is why the default feature set is empty.
rust_ffi = "RUSTFLAGS='-L build-e18c' cargo test --manifest-path projects/e18-industrial-logger/rust/Cargo.toml --features ffi"

[run]
# The oracle run: the Rust stub, no C, no model, no board. This is what CI does.
stub = "cargo run --manifest-path projects/e18-industrial-logger/rust/Cargo.toml -- --replay projects/e18-industrial-logger/replay/registers_600.csv --grammar projects/e18-industrial-logger/grammar.gbnf --prompt projects/e18-industrial-logger/prompt.txt --engine stub --log /tmp/e18_stub.csv"
# The daemon, then the service over its socket, with the real engine on the board.
daemon = "build-e18c/edgellm-e18-daemon --socket /run/edgellm/e18-daemon.sock --model ~/models/qwen2.5-0.5b-instruct-q4_k_m.gguf --grammar projects/e18-industrial-logger/grammar.gbnf --prompt projects/e18-industrial-logger/prompt.txt --state /run/edgellm/e18.state --n-ctx 512 --threads 4 --n-predict 64"
replay = "target/release/edgellm-e18 --replay projects/e18-industrial-logger/replay/registers_600.csv --grammar projects/e18-industrial-logger/grammar.gbnf --prompt projects/e18-industrial-logger/prompt.txt --engine socket --socket /run/edgellm/e18-daemon.sock --rs232 /dev/ttyAMA0 --log projects/e18-industrial-logger/evidence/e18_replay.csv"
live   = "target/release/edgellm-e18 --live --rs485-a /dev/ttySC0 --rs232 /dev/ttyAMA0 --grammar projects/e18-industrial-logger/grammar.gbnf --prompt projects/e18-industrial-logger/prompt.txt --engine socket --socket /run/edgellm/e18-daemon.sock --log projects/e18-industrial-logger/evidence/e18_live.csv"

[acceptance]
# One: the echo between the two RS485 channels, the one real electrical test here.
echo = "target/release/edgellm-e18 --echo 1000 --rs485-a /dev/ttySC0 --rs485-b /dev/ttySC1 --baud 115200 --grammar projects/e18-industrial-logger/grammar.gbnf --prompt projects/e18-industrial-logger/prompt.txt"
# Two: the agreement table over the replayed register stream.
table = "python tools/agreement.py projects/e18-industrial-logger/evidence/e18_replay.csv --md"

[measure]
# Three: what the boundary costs per call. Three figures on one prompt, one board, one
# model: in process with no boundary, through the C ABI in process, and through the
# daemon's socket. The first two come from the C test, the third from the service.
in_process_and_abi = "build-e18c/e18_abi_test --grammar projects/e18-industrial-logger/grammar.gbnf --prompt projects/e18-industrial-logger/prompt.txt --model ~/models/qwen2.5-0.5b-instruct-q4_k_m.gguf --calls 200"
ffi = "RUSTFLAGS='-L build-e18c' cargo run --release --manifest-path projects/e18-industrial-logger/rust/Cargo.toml --features ffi -- --bench 200 --engine ffi --model ~/models/qwen2.5-0.5b-instruct-q4_k_m.gguf --grammar projects/e18-industrial-logger/grammar.gbnf --prompt projects/e18-industrial-logger/prompt.txt"
socket = "target/release/edgellm-e18 --bench 200 --engine socket --socket /run/edgellm/e18-daemon.sock --grammar projects/e18-industrial-logger/grammar.gbnf --prompt projects/e18-industrial-logger/prompt.txt"

[oracle]
expected = "tests/oracle/e18.expected.csv"
compare  = "cargo test --manifest-path projects/e18-industrial-logger/rust/Cargo.toml --test oracle"
generate = "python projects/e18-industrial-logger/tools/make_replay.py"

[units]
# Two units: the daemon first, the service ordered after it. On Raspberry Pi OS copy
# both into /etc/systemd/system and edit the paths.
daemon  = "projects/e18-industrial-logger/files/edgellm-e18-daemon.service"
service = "projects/e18-industrial-logger/files/edgellm-e18.service"
