# The device service of project e18, the Rust half. The C half is configured on its
# own from ../c; nothing in this manifest builds it, which is the point.
#
# NO OPEN DEPENDENCY. This paragraph claimed one until Monday 9 November 2026, and each
# of its three claims was false. It said the shared crate common/rust/edgellm "is not in
# the tree yet": the crate landed in 949fd16 on Friday 16 October 2026, the same commit
# that introduced this manifest, so the sentence was never true, not even on the day it
# was written. It cited common/rust/README.md as saying so: that file describes the crate
# as written, for e05, in the shape of common/c. And it said the chapter says so in its
# pitfalls: chapter 18 carries no such pitfall and neither does PITFALLS.md. project.toml
# has carried the real history since Saturday 17 October 2026, naming the actual blocker
# at the time, which was this manifest listing the four modules as cargo features the
# crate does not declare. That was fixed below. This header was simply left behind, which
# is why a correction is not finished until every page stating the old thing is swept.
#
# What the service uses is four of the crate's modules, io, rules, elog and template, and
# NOT its engine module, because the engine of e18 lives in the C daemon. The interface it
# expects of each is written out at the top of src/main.rs, now annotated with what was MET
# and on what date; registers.rs and rules.rs carry their own tests and depend on nothing
# but the standard library. Both halves build and both suites pass as of Sunday 18 October
# 2026, 1 ctest for the C half and 22 unit tests plus 2 oracle tests for this one, the
# oracle including the 600-frame replay across the ABI. What remains is hardware and not
# software, and project.toml states it.
[package]
name = "edgellm-e18"
version = "0.1.0"
edition = "2021"
# 1.75, raised from 1.74 on Tuesday 20 October 2026, because 1.74 was a number nobody had
# tested and 1.75.0 is what poky at scarthgap supplies to cross-build this project. Checked
# clean under 1.75.0; the reasoning is in common/rust/edgellm/Cargo.toml. A floor below what
# the code needs is the worse direction of this defect: cargo permits the toolchain and the
# compiler fails later, which is exactly what e18 did with E0658.
rust-version = "1.75"
license = "MIT"
description = "e18, a mini industrial serial logger: a Rust device service over a C ABI"
repository = "https://github.com/ambrosiobing/edge-llm-pi"
publish = false

[[bin]]
name = "edgellm-e18"
path = "src/main.rs"

[dependencies]
# default-features = false so that the crate's engine module, which links
# llama-cpp-2, is never compiled here: this project's engine is the C daemon, and
# linking a second copy of the engine into the service would defeat the boundary the
# chapter is about.
# io, rules, elog and template are modules of that crate and not cargo features of it:
# it declares only "stub", its default, and "engine". Naming them in a features list made
# cargo refuse this manifest before compiling a line, which no job noticed because the
# repository's Rust loop globbed projects/*/Cargo.toml and this one is a level deeper.
# e05's and e13's manifests carry exactly the line below, and both build.
# "serial" brings io::serial::Port, which this service needs for RS232 and the two
# RS485 channels. Neither engine feature is enabled: the engine here is the C daemon.
edgellm = { path = "../../../common/rust/edgellm", default-features = false, features = [
    "serial",
] }

[features]
# Off by default. The FFI backend links libedgellm_abi.so, which means the C half must
# be built first and the linker must be given its path, neither of which CI has:
#
#     cmake -S ../c -B ../../../build-e18c -DEDGELLM_STUB_MODEL=ON
#     cmake --build ../../../build-e18c
#     RUSTFLAGS="-L ../../../build-e18c" cargo test --features ffi
#
# With the feature off the service still reaches the same four functions over the
# daemon's Unix domain socket, and the Rust stub of src/abi.rs runs the whole loop
# with no C at all, which is what the oracle test uses.
default = []
ffi = []

[profile.release]
# A logger that runs for weeks: the smaller binary and the aborting panic are both
# easier to reason about in a unit than a backtrace nobody will read.
opt-level = 2
panic = "abort"
strip = true
