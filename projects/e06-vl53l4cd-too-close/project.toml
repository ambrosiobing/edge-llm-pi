# projects/e06-vl53l4cd-too-close/project.toml: the manifest CI and the tools read.
[project]
id       = "e06"
title    = "VL53L4CD too close explainer"
language = "C"
variant  = "C"
board    = "Raspberry Pi 3 Model B Rev 1.2, 1 GB; the card named in the evidence file"
hat      = "none: the VL53L4CD and the ADXL345 of e05 on the bare header, pins 1, 3, 5, 9"
model    = "SmolLM2-360M-Instruct-Q4_K_M.gguf; qwen2.5-0.5b-instruct-q4_k_m.gguf if the agreement is poor"
grammar  = "grammars/e06_range.gbnf"
prompt   = "projects/e06-vl53l4cd-too-close/prompt.txt"
rule     = "projects/e06-vl53l4cd-too-close/src/rules_e06.c"
binary   = "edgellm-e06"

[build]
# From the repository root, after cmake -S . -B build [-DEDGELLM_STUB_MODEL=ON]. The live
# backend compiles only with -DEDGELLM_VL53L4CD_ULD_DIR=<path to the unpacked ST ULD>,
# which the host build and CI leave unset.
command = "cmake --build build --target edgellm-e06 rules_test oracle_check"
# The six rule cases run inside the shared harness; the oracle test exists in a stub build.
test    = "ctest --test-dir build -R 'rules_test|edgellm-e06-oracle' --output-on-failure"

[run]
replay = "build/projects/e06-vl53l4cd-too-close/edgellm-e06 --project e06 --replay projects/e06-vl53l4cd-too-close/replay/approaches.csv --grammar projects/e06-vl53l4cd-too-close/grammar.gbnf --prompt projects/e06-vl53l4cd-too-close/prompt.txt --model ~/models/SmolLM2-360M-Instruct-Q4_K_M.gguf --n-predict 40 --state /tmp/e06.state --log projects/e06-vl53l4cd-too-close/evidence/e06_replay.csv"
stub   = "build/projects/e06-vl53l4cd-too-close/edgellm-e06 --project e06 --replay projects/e06-vl53l4cd-too-close/replay/approaches.csv --grammar projects/e06-vl53l4cd-too-close/grammar.gbnf --prompt projects/e06-vl53l4cd-too-close/prompt.txt --log /tmp/e06_stub.csv --stub"
live   = "build/projects/e06-vl53l4cd-too-close/edgellm-e06 --project e06 --live vl53l4cd /dev/i2c-1:0x29:interval=0.1:budget=50 --grammar projects/e06-vl53l4cd-too-close/grammar.gbnf --prompt projects/e06-vl53l4cd-too-close/prompt.txt --model ~/models/SmolLM2-360M-Instruct-Q4_K_M.gguf --n-predict 40 --state /tmp/e06.state --log projects/e06-vl53l4cd-too-close/evidence/e06_run.csv"

[oracle]
expected = "tests/oracle/e06.expected.csv"
compare  = "build/tests/oracle_check /tmp/e06_stub.csv tests/oracle/e06.expected.csv"
table    = "python tools/agreement.py projects/e06-vl53l4cd-too-close/evidence/e06_run.csv --md"

[sensor]
# Read from learn.adafruit.com (the pinouts page) and adafruit.com/product/5396 on
# Wednesday 14 October 2026; the ST user manual UM2931 and the STSW-IMG026 page were not
# reachable from this laptop that day and stay to verify.
part      = "Adafruit VL53L4CD, product 5396, single zone, about 1 to 1300 mm"
address   = "0x29 seven-bit; the ST ULD passes the eight-bit form 0x52"
pullups   = "10 kOhm on the breakout, 1.8 kOhm fitted on the Pi's pins 3 and 5"
bus       = "/dev/i2c-1 at 100 kHz, shared with the ADXL345 at 0x53"
interval  = "0.1 s, timing budget 50 ms, autonomous mode"
status    = "only range status 0 is a valid range; the rule treats every other value as no range"
uld       = "STSW-IMG026, out of tree, pointed at by EDGELLM_VL53L4CD_ULD_DIR; licence to verify on the ST page, BSD 3-Clause in the stm32duino mirror"
