# CI for edge-llm-pi. Four jobs:
#   host        the C core, every C and C++ project and the tests with the stub engine
#               and every I/O backend compiled in; then the two repository scans
#   engine      the real engine from the submodule at the pinned tag, compile only,
#               so a header change upstream is seen here and not on the bench
#   manifests   cargo test in every projects/*/ with a Cargo.toml, pytest in every
#               projects/*/ with a pyproject.toml
#   yocto       the layer parsed by bitbake-layers and bitbake -p in a poky container;
#               allowed to fail, see the comment on the job
name: ci

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev pkg-config
      - name: libgpiod 2, built from source
        # Ubuntu noble's libgpiod-dev is 1.6.3, and this repository's GPIO backend is
        # written against the v2 API that the bench has: Debian trixie carries 2.2.1 on
        # the Raspberry Pi. No Ubuntu LTS archive has a v2 package, so installing
        # libgpiod-dev here gave "libgpiod>=2.0 not found" and the configure stopped.
        # Building the bench's own version is both the fix and the honest one: CI then
        # compiles the backend against the same API the board runs. Takes about a minute.
        run: |
          base=https://mirrors.edge.kernel.org/pub/software/libs/libgpiod
          curl -sL "$base/libgpiod-2.2.1.tar.gz" -o /tmp/libgpiod.tar.gz
          tar -C /tmp -xf /tmp/libgpiod.tar.gz
          cd /tmp/libgpiod-2.2.1
          ./configure --prefix=/usr --enable-tools=no --enable-bindings-cxx=no
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          pkg-config --modversion libgpiod
      - name: submodule sits at the pinned tag
        run: |
          tag=$(sed -n 's/^set(LLAMA_CPP_TAG "\(.*\)")$/\1/p' cmake/llama_tag.cmake)
          got=$(git -C third_party/llama.cpp describe --tags --exact-match 2>/dev/null \
                || echo none)
          echo "pinned $tag, checked out $got"
          test "$got" = "$tag"
      - name: configure with the stub and every backend
        run: |
          cmake -S . -B build -G Ninja -DEDGELLM_STUB_MODEL=ON \
            -DEDGELLM_IO_GPIO=ON -DEDGELLM_IO_I2C=ON -DEDGELLM_IO_IIO=ON \
            -DEDGELLM_IO_SERIAL=ON -DEDGELLM_IO_CAN=ON
      - name: build
        run: cmake --build build
      - name: the suite is not silently short
        # "0 tests failed out of 4" was a green run for three pushes while twelve oracle
        # tests and five unit tests did not exist, because enable_testing() was called
        # after the projects were added and CMake dropped their add_test() calls without
        # a word. A suite that can shrink to nothing and still pass is not a check, so
        # the count is asserted before it is trusted. Raise the floor when projects gain
        # tests; never lower it to make a run go green.
        run: |
          n=$(ctest --test-dir build -N | sed -n 's/^Total Tests: //p')
          echo "ctest registered $n tests"
          test "${n:-0}" -ge 15
      - name: ctest
        run: ctest --test-dir build --output-on-failure
      - name: attribution scan over the tree and the history
        run: python3 tools/no_trace_scan.py
      - name: no authoring files
        run: python3 tools/no_authoring_files.py
      - name: ASCII and 99 columns
        run: python3 tools/line_check.py
      - name: python tools compile
        run: python3 -m py_compile tools/*.py

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config
      - name: libgpiod 2, built from source
        # See the same step in the host job: Ubuntu has no v2 package and the backend is
        # written against v2, which is what the bench runs.
        run: |
          base=https://mirrors.edge.kernel.org/pub/software/libs/libgpiod
          curl -sL "$base/libgpiod-2.2.1.tar.gz" -o /tmp/libgpiod.tar.gz
          tar -C /tmp -xf /tmp/libgpiod.tar.gz
          cd /tmp/libgpiod-2.2.1
          ./configure --prefix=/usr --enable-tools=no --enable-bindings-cxx=no
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
      - name: configure against the submodule
        run: |
          cmake -S . -B build-engine -G Ninja -DEDGELLM_BUILD_LLAMA_TOOLS=OFF \
            -DEDGELLM_BUILD_TESTS=ON -DEDGELLM_IO_GPIO=ON -DEDGELLM_IO_I2C=ON \
            -DEDGELLM_IO_IIO=ON -DEDGELLM_IO_SERIAL=ON -DEDGELLM_IO_CAN=ON
      - name: build the core and the smoke project
        run: cmake --build build-engine --target edgellm_core edgellm-smoke cpp_wrapper_test

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgpiod-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test in every Rust project
        run: |
          set -e
          for m in projects/*/Cargo.toml; do
            [ -f "$m" ] || continue
            echo "== $m"
            cargo test --manifest-path "$m"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest over the orchestration tools
        # bench_runner.py decides whether a measured run passes or fails, so it is measured
        # here. The fixtures are e01's first real run and the expected percentages were
        # worked out by hand before the parser existed. Needs no board and no model file.
        run: |
          python -m pip install -r requirements.txt
          python -m pytest tools/tests
      - name: pytest in every Python project
        run: |
          set -e
          python -m pip install -r requirements.txt
          for m in projects/*/pyproject.toml; do
            [ -f "$m" ] || continue
            d=$(dirname "$m")
            echo "== $d"
            python -m pip install -e "$d"
            python -m pytest "$d"
          done

  yocto:
    runs-on: ubuntu-latest
    # Allowed to fail: the poky container and the three layer clones take minutes and
    # depend on hosts this repository does not control, and a parse error here says
    # nothing a bench build would not say sooner. The job exists so that a broken
    # recipe is seen on the push that broke it; the image build is skyhorizon's job.
    continue-on-error: true
    # No container. The crops/poky image was run with --user root and BitBake refuses
    # that outright: "Do not use Bitbake as root", which is the whole of why this job
    # was red on Friday 16 October 2026, after every layer had already been added and
    # accepted. The runner's own user is not root, so dropping the container removes the
    # problem rather than working around it, and the host packages below are the subset
    # of the Yocto quick-start list that a parse needs. A parse compiles nothing.
    steps:
      - uses: actions/checkout@v4
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk diffstat unzip texinfo chrpath cpio xz-utils \
            debianutils iputils-ping python3-git python3-jinja2 python3-pexpect \
            python3-subunit zstd liblz4-tool file locales libacl1
          sudo locale-gen en_US.UTF-8
      - name: let BitBake use user namespaces
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, and
        # BitBake needs them: "User namespaces are not usable by BitBake, possibly due to
        # AppArmor". This is the workaround the release notes themselves give, and it is
        # a runner-only setting that touches nothing in this repository.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: layers at the bench release
        run: |
          git clone --depth 1 -b scarthgap https://git.yoctoproject.org/poky /tmp/poky
          git clone --depth 1 -b scarthgap https://git.openembedded.org/meta-openembedded \
            /tmp/meta-openembedded
          git clone --depth 1 -b scarthgap https://git.yoctoproject.org/meta-raspberrypi \
            /tmp/meta-raspberrypi
      - name: parse
        shell: bash
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd /tmp/poky
          source oe-init-build-env /tmp/build
          bitbake-layers add-layer /tmp/meta-openembedded/meta-oe
          bitbake-layers add-layer /tmp/meta-raspberrypi
          bitbake-layers add-layer "$GITHUB_WORKSPACE/meta-edgellm"
          echo 'MACHINE = "raspberrypi4-64"' >> conf/local.conf
          echo 'LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"' >> conf/local.conf
          bitbake-layers show-layers
          bitbake -p
          bitbake-layers show-recipes "llama-cpp" "edgellm-*" "model-*"
