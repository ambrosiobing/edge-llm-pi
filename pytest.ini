; Running pytest from the repository root collects several projects at once, and three of
; them carry a tests/test_oracle.py. Without this, pytest derives a module name from the
; basename, finds "test_oracle" already imported from another project, and stops the whole
; collection with "import file mismatch" before a single test runs. CI never saw it because
; it runs pytest once per project; a person running "pytest" at the root sees nothing else.
; importlib import mode gives each file its own module identity and needs no __init__.py.
; Added Friday 16 October 2026.
; pythonpath added Tuesday 20 October 2026, and without it the testpaths below were a
; statement of intent rather than something anyone could run. All three packages are flat,
; so the directory holding each pyproject.toml is its import root; none of them was on the
; path, so bare "pytest" at the root collected every suite named here and then stopped at
; "ModuleNotFoundError: No module named 'edgellm'" before running one test. Continuous
; integration did not see it either, for the opposite reason: it installed each package
; with pip install -e and globbed one level deep, so it never reached common/python at all.
; Two routes to the same four suites and neither of them ran them.
;
; tools/pytest_all.py checks this list against a walk of the tree, because a hand-written
; list of paths goes stale in exactly the way the one-level glob did.
[pytest]
addopts = --import-mode=importlib
pythonpath =
    common/python/edgellm
    projects/e15-esp32-sidecar
    projects/e20-scorecard
testpaths =
    common/python/edgellm/tests
    projects/e15-esp32-sidecar/tests
    projects/e20-scorecard/tests
    tools/tests
