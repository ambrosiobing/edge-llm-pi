# meta-edgellm layer configuration.
#
# Three recipe kinds, after the structure the volume adopts: recipes-app/ (one per
# project: binary, prompt, grammar, unit), recipes-runtime/ (llama.cpp at the pinned
# tag), recipes-model/ (GGUF packages with their SHA256). Plus recipes-images/ with the
# image that assembles them. Machine and distro selection live in kas/, never here, so
# the same layer serves raspberrypi4-64, raspberrypi3-64 and the NanoPi.
#
# The release is scarthgap because that is what the bench's meta-bench layer declares
# (embedded-linux-bench, meta-bench/conf/layer.conf, read Wednesday 14 October 2026);
# the kas files here include the bench's board files, so the two layers must agree.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "edgellm"
BBFILE_PATTERN_edgellm = "^${LAYERDIR}/"
BBFILE_PRIORITY_edgellm = "11"

LAYERDEPENDS_edgellm = "core openembedded-layer raspberrypi"
LAYERSERIES_COMPAT_edgellm = "scarthgap"
LAYERVERSION_edgellm = "1"

# The application recipes build the sources that sit beside this layer in the same
# repository (common/, cmake/, projects/eNN-slug/), so the repository root is exported
# once here and recipes-app/edgellm-common.inc uses it in FILESEXTRAPATHS.
EDGELLM_LAYERDIR := "${LAYERDIR}"
EDGELLM_REPO_ROOT := "${LAYERDIR}/.."
