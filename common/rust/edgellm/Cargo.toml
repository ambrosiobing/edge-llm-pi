# common/rust/edgellm/Cargo.toml: the shared Rust crate of the repository, written for e05
# and reused by e13, e14 and e18's service. One engine behind two cargo features: "engine"
# links llama.cpp through the llama-cpp-2 binding into the one executable (catalogue variant
# R7); "stub", the default and what CI builds, answers from the grammar alone the way
# common/c/src/edgellm_stub.c does, so the loop, the log and every oracle test run on a host
# with no model file and no C++ toolchain.
[package]
name = "edgellm"
version = "0.1.0"
edition = "2021"
# 1.75 and not 1.80, corrected Tuesday 20 October 2026 and lowered on a compile rather than
# on an argument. The layer pins poky at scarthgap, whose rust is 1.75.0, and e05, e13, e14
# and e18 inherit cargo, so scarthgap's cargo is what cross-builds them. With 1.80 declared
# it refused outright: "package `edgellm v0.1.0` cannot be built because it requires rustc
# 1.80 or newer, while the currently active rustc version is 1.75.0". The first image build
# of e05 or e13 would have stopped there, and no image has been built yet, so nothing had
# said so.
#
# The floor was never derived: all three crates that carried 1.80 took it in the initial
# commit 949fd16 with no comment, and all three check clean under 1.75.0 with
# --ignore-rust-version, which is how this value was chosen. Raise it only for a feature
# that is actually used, and then only if scarthgap can supply it.
rust-version = "1.75"
license = "MIT"
description = "The decision loop over a grammar-constrained local model, in Rust"
publish = false

[features]
default = ["stub"]
stub = []
engine = ["dep:llama-cpp-2"]
# io::serial, for a project that drives its own RS232 or RS485 line. The feature still
# gates the module; it no longer gates the libc dependency, because elog now needs flock in
# every build. See the libc entry below.
serial = []

[dependencies]
# Pinned on Wednesday 14 October 2026: 0.1.159 is the newest release on crates.io, published
# Wednesday 7 October 2026, MIT OR Apache-2.0. The binding builds its own copy of llama.cpp
# through llama-cpp-sys-2 at the same version number; that copy is NOT the C projects'
# v0.6.0 tag, see common/rust/README.md for the commit and what it means for a tokens per
# second figure. default-features = false drops the "common" feature (the JSON schema to
# grammar helper and its libcommon.a) and the OpenMP default; the loop needs neither, and
# ggml's own thread pool serves the four threads of a Pi.
llama-cpp-2 = { version = "=0.1.159", optional = true, default-features = false }
# Required rather than optional since Monday 26 October 2026, and the note it replaces said
# "e05, e13 and e14 have no serial line and should not take libc for one". That was right
# about serial lines and is now beside the point: elog::Elog::open takes flock on the log in
# every build, so every project that writes a log needs libc whether it drives a serial line
# or not. termios, poll, read and write for io::serial; flock for the logger.
#
# This costs nothing in resolution. Cargo.lock records optional dependencies too, so libc
# 0.2.191 was already in the graph of all five crates and the committed lockfiles are
# unchanged by this. 0.2 is the published major line and this crate pins nothing tighter,
# because it calls only the long-stable POSIX surface.
libc = { version = "0.2" }
